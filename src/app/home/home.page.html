<ion-header>
  <ion-toolbar>
    <ion-title>Pomodoro Timer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Current Time: {{ currentTime }}</h2>

  <div *ngIf="timerRunning">
    <h1>{{ formatTime(countdown) }}</h1>
    <h3 *ngIf="isBreak">Break Time</h3>
    <h3 *ngIf="!isBreak">Work Time</h3>
  </div>

  <div *ngIf="!timerRunning">
    <ion-button expand="block" (click)="startPomodoro()">Start Pomodoro Cycle</ion-button>
  </div>
</ion-content>
